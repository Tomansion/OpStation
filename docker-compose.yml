# OpStation. One image: it plays scenarios and, via the admin panel,
# generates new ones -- the LLM client, Piper and the voice models all live
# in it now.
#
#   docker compose up app   # play, and open /admin to generate
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "3000:3000"
    environment:
      # Read from the host environment or a .env file beside this compose file.
      # Only the key matching OPSTATION_LLM_MODEL's provider needs a value.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPSTATION_LLM_MODEL: ${OPSTATION_LLM_MODEL:-mistral/mistral-large-latest}
    volumes:
      # The bank and the session records.
      - ./data:/data
      # Editing the layout or the tunables should not need a rebuild.
      - ./station:/app/station:ro
      - ./config:/app/config:ro
    restart: unless-stopped
